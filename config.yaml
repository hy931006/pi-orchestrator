# Pi Orchestrator 配置文件
server:
  host: "0.0.0.0"
  port: 8020

database:
  path: "./orchestrator.db"

agents:
  # 按优先级排序，daemon 自动检测 PATH 上的可用 agent
  - name: "pi"
    binary: "pi"
    args: "--print"
  - name: "omp"
    binary: "omp"
    args: "-p"

workspace:
  root: "~/.pi-orchestrator/worktrees"

daemon:
  poll_interval: 3      # 轮询任务队列间隔（秒）
  heartbeat_interval: 15  # 心跳间隔（秒）
  max_concurrent: 3      # 最大并发任务数
  task_timeout: 7200     # 单任务超时（秒），默认 2 小时
