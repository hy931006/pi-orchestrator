name: minimal
description: 最小二阶段模板（测试用）
version: 1

stages:
  - key: fix
    label: 修复
    index: 0
    agent:
      model: ""
      system_prompt: |
        你是编码工程师。修复指定问题并提交。
    required_artifacts:
      - "*.py"
    gate_rules: ""
    context_inject:
      prior_stages: []

  - key: verify
    label: 验证
    index: 1
    agent:
      model: ""
      system_prompt: |
        你是验证工程师。检查修复结果，输出验证结论。
    required_artifacts:
      - "*result*.md"
    gate_rules: ""
    context_inject:
      prior_stages: ["fix"]
