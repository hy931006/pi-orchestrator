name: default
description: 标准五阶段开发流程（绑定预设 Agent）
version: 2

stages:
  - key: feasibility
    label: 可行性分析
    index: 0
    agent_ref: 可行性分析师
    agent:
      model: ""
      system_prompt: ""
    required_artifacts:
      - "*-report.md"
      - "gate-checks.yaml"
      - "gate_check.py"
      - "gate-result.md"
    gate_rules: "01-feasibility/gate-checks.yaml"
    context_inject:
      prior_stages: []

  - key: design
    label: 详细设计
    index: 1
    agent_ref: 系统架构师
    agent:
      model: ""
      system_prompt: ""
    required_artifacts:
      - "*-design-report.md"
      - "*-gate-checks.yaml"
      - "*-gate_check.py"
      - "*-gate-result.md"
    gate_rules: "02-design/gate-checks.yaml"
    context_inject:
      prior_stages: ["feasibility"]

  - key: plan
    label: 实施计划
    index: 2
    agent_ref: 实施计划师
    agent:
      model: ""
      system_prompt: ""
    required_artifacts:
      - "*-plan.md"
      - "*-gate-checks.yaml"
      - "*-gate_check.py"
      - "*-gate-result.md"
    gate_rules: "03-plan/gate-checks.yaml"
    context_inject:
      prior_stages: ["feasibility", "design"]

  - key: implementation
    label: 实施
    index: 3
    agent_ref: 编码工程师
    agent:
      model: ""
      system_prompt: ""
    required_artifacts:
      - "*.py"
    gate_rules: "04-implementation/gate-checks.yaml"
    context_inject:
      prior_stages: ["plan", "design"]

  - key: qa
    label: QA
    index: 4
    agent_ref: QA工程师
    agent:
      model: ""
      system_prompt: ""
    required_artifacts:
      - "*-qa-report.md"
      - "*-gate-result.md"
    gate_rules: "05-qa/gate-checks.yaml"
    context_inject:
      prior_stages: ["implementation"]
