<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Orchestrator</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-card: #161b22;
            --bg-input: #21262d;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
            --accent: #58a6ff;
            --green: #3fb950;
            --red: #f85149;
            --yellow: #d2991d;
            --purple: #a371f7;
            --orange: #db6d28;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        h1 span { font-size: 0.85rem; color: var(--text-dim); font-weight: normal; }

        /* ── Tabs ── */
        .tabs {
            display: flex; gap: 4px; border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .tab {
            background: transparent; border: none; color: var(--text-dim);
            padding: 10px 18px; font-size: 0.95rem; cursor: pointer;
            border-bottom: 2px solid transparent; margin-bottom: -1px;
            font-weight: 600;
        }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* Stats bar */
        .stats { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .stat {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 18px;
            min-width: 100px;
            text-align: center;
        }
        .stat .num { font-size: 1.6rem; font-weight: 700; }
        .stat .label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
        .stat.queued .num { color: var(--yellow); }
        .stat.running .num { color: var(--accent); }
        .stat.completed .num { color: var(--green); }
        .stat.failed .num { color: var(--red); }
        .stat.blocked .num { color: var(--red); }

        /* Create form */
        .create-form {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 24px;
        }
        .create-form h2 { font-size: 1rem; margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-row input, .form-row textarea, .form-row select {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }
        .form-row input:focus, .form-row textarea:focus, .form-row select:focus {
            border-color: var(--accent);
        }
        .form-row textarea { resize: vertical; min-height: 60px; }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { opacity: 0.9; }
        button.danger { background: var(--red); }
        button.warn { background: var(--orange); }
        button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
        button.small { padding: 4px 10px; font-size: 0.8rem; }

        /* Task list */
        .task-list-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        .filter-btn.active { border-color: var(--accent); color: var(--accent); }

        .task-card, .wf-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .task-card:hover, .wf-card:hover { border-color: var(--accent); }
        .task-card .header, .wf-card .header {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 12px;
        }
        .task-card .title, .wf-card .title { font-weight: 600; font-size: 0.95rem; }
        .task-card .meta, .wf-card .meta { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; }
        .task-card .log-preview {
            margin-top: 10px;
            background: var(--bg);
            border-radius: 6px;
            padding: 10px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.78rem;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-dim);
            display: none;
        }
        .task-card.expanded .log-preview { display: block; }

        /* Workflow timeline */
        .wf-detail { display: none; margin-top: 12px; }
        .wf-card.expanded .wf-detail { display: block; }
        .stage-row {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; border-left: 3px solid var(--border);
            margin: 6px 0; background: var(--bg); border-radius: 0 6px 6px 0;
            flex-wrap: wrap;
        }
        .stage-row.current { border-left-color: var(--accent); }
        .stage-row.done { border-left-color: var(--green); }
        .stage-row .stage-name { font-weight: 600; min-width: 90px; font-size: 0.85rem; }
        .stage-row .stage-meta { font-size: 0.75rem; color: var(--text-dim); flex: 1; }
        .stage-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .stage-actions input[type=text] {
            background: var(--bg-input); border: 1px solid var(--border);
            border-radius: 4px; padding: 4px 8px; color: var(--text);
            font-size: 0.78rem; width: 200px; outline: none;
        }
        .stage-result {
            width: 100%; margin-top: 6px; background: var(--bg-card);
            border-radius: 4px; padding: 8px; font-size: 0.75rem;
            color: var(--text-dim); white-space: pre-wrap; word-break: break-all;
            max-height: 150px; overflow-y: auto; font-family: monospace;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .badge-queued { background: rgba(210,153,29,0.15); color: var(--yellow); }
        .badge-claimed { background: rgba(163,113,247,0.15); color: var(--purple); }
        .badge-running { background: rgba(88,166,255,0.15); color: var(--accent); }
        .badge-completed { background: rgba(63,185,80,0.15); color: var(--green); }
        .badge-failed { background: rgba(248,81,73,0.15); color: var(--red); }
        .badge-cancelled { background: rgba(139,148,158,0.15); color: var(--text-dim); }
        .badge-blocked { background: rgba(248,81,73,0.15); color: var(--red); text-decoration:line-through; }
        .badge-wf-running { background: rgba(88,166,255,0.15); color: var(--accent); }
        .badge-wf-completed { background: rgba(63,185,80,0.15); color: var(--green); }
        .badge-wf-failed { background: rgba(248,81,73,0.15); color: var(--red); }
        .badge-wf-cancelled { background: rgba(139,148,158,0.15); color: var(--text-dim); }
        .badge-gate-pending { background: rgba(139,148,158,0.15); color: var(--text-dim); }
        .badge-gate-auto_passed { background: rgba(63,185,80,0.15); color: var(--green); }
        .badge-gate-auto_failed { background: rgba(248,81,73,0.15); color: var(--red); }
        .badge-gate-approved { background: rgba(63,185,80,0.2); color: var(--green); }
        .badge-gate-rejected { background: rgba(210,153,29,0.15); color: var(--yellow); }
        .badge-gate-forced { background: rgba(219,109,40,0.15); color: var(--orange); }
        .badge-gate-waived { background: rgba(163,113,247,0.15); color: var(--purple); }

        /* Agent bar */
        .agent-bar {
            display: flex; gap: 8px; align-items: center;
            margin-bottom: 20px; font-size: 0.82rem; color: var(--text-dim);
            flex-wrap: wrap;
        }
        .agent-dot { width: 8px; height: 8px; border-radius: 50%; }
        .agent-dot.online { background: var(--green); }
        .agent-dot.offline { background: var(--red); }

        .loading { text-align: center; color: var(--text-dim); padding: 40px; }
        .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; }
        .empty .icon { font-size: 3rem; margin-bottom: 10px; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse { animation: pulse 2s infinite; }
        .task-actions { display: flex; gap: 6px; }

        /* Workflow progress bar */
        .wf-progress { margin-top: 8px; }
        .progress-track {
            background: var(--bg); border-radius: 4px; height: 6px; overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, var(--accent), var(--green));
            height: 100%; border-radius: 4px; transition: width 0.5s;
        }
        .wf-stages-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }

        /* ── Designer (canvas) ── */
        .designer-layout {
            display: grid;
            grid-template-columns: 160px 1fr 280px;
            gap: 12px;
            height: 560px;
        }
        .node-palette, .canvas-wrap, .node-config {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            overflow: hidden;
        }
        .node-palette h3, .node-config h3 {
            font-size: 0.85rem; margin-bottom: 10px; color: var(--text-dim);
        }
        .palette-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: grab;
            font-size: 0.82rem;
            text-align: center;
            user-select: none;
        }
        .palette-item:hover { border-color: var(--accent); }
        .palette-item:active { cursor: grabbing; }

        .canvas-wrap { display: flex; flex-direction: column; }
        .canvas-toolbar {
            display: flex; align-items: center;
            font-size: 0.75rem; color: var(--text-dim);
            padding-bottom: 8px; border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }
        .canvas-scroll {
            flex: 1; overflow: auto; position: relative;
            background:
                radial-gradient(circle, var(--border) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .canvas {
            position: relative;
            width: 2000px; height: 1200px;
            transform-origin: 0 0;
            transition: transform 0.1s;
        }
        .edges-svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .edge-path {
            stroke: var(--accent);
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 6 4;
            pointer-events: stroke;
        }
        .edge-path.edge-temp { stroke: var(--yellow); stroke-dasharray: 4 4; }
        #nodes-layer { position: relative; z-index: 2; }
        .flow-node {
            position: absolute;
            width: 150px;
            background: var(--bg-card);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            cursor: move;
            user-select: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .flow-node:hover { border-color: var(--accent); }
        .flow-node.selected { border-color: var(--green); box-shadow: 0 0 0 2px rgba(63,185,80,0.2); }
        .flow-node .node-title { font-size: 0.8rem; font-weight: 600; }
        .flow-node .node-sub { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }
        .flow-node.start-node { border-color: var(--green); }
        .flow-node.end-node { border-color: var(--purple); }
        .node-port {
            position: absolute;
            right: -7px; top: 50%;
            width: 14px; height: 14px;
            background: var(--accent);
            border: 2px solid var(--bg);
            border-radius: 50%;
            cursor: crosshair;
            transform: translateY(-50%);
            z-index: 5;
        }
        .node-port:hover { background: var(--green); }
        .node-port.in-port { left: -7px; right: auto; }

        .node-config { overflow-y: auto; }
        .config-field { margin-bottom: 10px; }
        .config-field label {
            display: block; font-size: 0.72rem; color: var(--text-dim);
            margin-bottom: 4px;
        }
        .config-field input, .config-field textarea, .config-field select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 8px;
            color: var(--text);
            font-size: 0.78rem;
            outline: none;
        }
        .config-field textarea { resize: vertical; min-height: 70px; font-family: monospace; }
        .delete-node-btn {
            width: 100%; margin-top: 6px;
            background: var(--red); color: #fff;
            border: none; border-radius: 4px;
            padding: 6px; font-size: 0.78rem; cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>⚙️ Pi Orchestrator <span>— Agent 任务调度器 + 工作流编排</span></h1>

    <!-- Agent 状态栏 -->
    <div class="agent-bar" id="agent-bar">加载中...</div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" id="tab-tasks" onclick="switchTab('tasks')">📋 任务</button>
        <button class="tab" id="tab-workflows" onclick="switchTab('workflows')">🔀 工作流</button>
        <button class="tab" id="tab-designer" onclick="switchTab('designer')">🎨 编排器</button>
    </div>

    <!-- ═══════════ 任务面板 ═══════════ -->
    <div class="tab-panel active" id="panel-tasks">
        <!-- 统计面板 -->
        <div class="stats" id="stats">
            <div class="stat queued"><div class="num">-</div><div class="label">排队</div></div>
            <div class="stat running"><div class="num">-</div><div class="label">运行中</div></div>
            <div class="stat completed"><div class="num">-</div><div class="label">已完成</div></div>
            <div class="stat failed"><div class="num">-</div><div class="label">失败</div></div>
            <div class="stat blocked"><div class="num">-</div><div class="label">阻塞</div></div>
        </div>

        <!-- Agent 管理面板 -->
        <div class="create-form" id="agent-panel">
            <h2>🤖 Agent 管理 <button class="small ghost" onclick="toggleAgentPanel()" style="float:right">收起</button></h2>
            <div id="agent-list" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;"></div>
            <div class="form-row">
                <input type="text" id="agent-name" placeholder="Agent 名称" style="flex:1" />
                <input type="text" id="agent-model" placeholder="模型 (可选，如 deepseek/deepseek-v4-flash)" style="flex:1" />
                <button onclick="createAgent()" style="flex-shrink:0">创建 Agent</button>
            </div>
            <div class="form-row">
                <textarea id="agent-prompt" placeholder="System Prompt — 定义 Agent 的人格和能力" style="min-height:40px;"></textarea>
            </div>
        </div>

        <!-- 创建任务表单 -->
        <div class="create-form">
            <h2>📝 新建任务</h2>
            <div class="form-row">
                <input type="text" id="task-title" placeholder="任务标题（必填）" />
                <select id="task-agent" style="flex:0 0 200px;">
                    <option value="auto">自动 (无 Agent)</option>
                </select>
            </div>
            <div class="form-row">
                <textarea id="task-desc" placeholder="任务描述 / Prompt（选填）"></textarea>
            </div>
            <div class="form-row">
                <input type="text" id="task-repo" placeholder="代码仓库路径（留空 = 当前目录）" style="flex:2" />
                <button onclick="createTask()">创建任务</button>
            </div>
        </div>

        <!-- 任务列表 -->
        <div class="task-list-header">
            <h2>📋 任务列表</h2>
            <div class="filter-btns">
                <button class="filter-btn active" onclick="setFilter('')">全部</button>
                <button class="filter-btn" onclick="setFilter('queued')">排队</button>
                <button class="filter-btn" onclick="setFilter('running')">运行中</button>
                <button class="filter-btn" onclick="setFilter('completed')">已完成</button>
                <button class="filter-btn" onclick="setFilter('failed')">失败</button>
                <button class="filter-btn" onclick="setFilter('blocked')">阻塞</button>
                <button class="filter-btn" onclick="setFilter('cancelled')">已取消</button>
            </div>
        </div>
        <div id="task-list"><div class="loading">⏳ 加载中...</div></div>
    </div>

    <!-- ═══════════ Workflows 面板 ═══════════ -->
    <div class="tab-panel" id="panel-workflows">
        <!-- 创建 workflow 表单 -->
        <div class="create-form">
            <h2>🔀 新建工作流</h2>
            <div class="form-row">
                <select id="wf-template" style="flex:0 0 220px;"></select>
                <input type="text" id="wf-title" placeholder="工作流标题（必填）" />
            </div>
            <div class="form-row">
                <input type="text" id="wf-repo" placeholder="代码仓库路径（留空 = 当前目录）" style="flex:2" />
                <button onclick="createWorkflow()">创建工作流</button>
            </div>
            <div class="form-row" id="wf-template-desc" style="font-size:0.8rem;color:var(--text-dim);margin:0;"></div>
        </div>

        <!-- workflow 列表 -->
        <div class="task-list-header">
            <h2>🔀 工作流列表</h2>
            <div class="filter-btns">
                <button class="filter-btn active" onclick="setWfFilter('')">全部</button>
                <button class="filter-btn" onclick="setWfFilter('running')">运行中</button>
                <button class="filter-btn" onclick="setWfFilter('completed')">已完成</button>
                <button class="filter-btn" onclick="setWfFilter('failed')">失败</button>
            </div>
        </div>
        <div id="wf-list"><div class="loading">⏳ 加载中...</div></div>
    </div>

    <!-- ═══════════ 编排器面板（拖拽画布） ═══════════ -->
    <div class="tab-panel" id="panel-designer">
        <div class="create-form">
            <h2>🎨 可视化编排器 <span style="font-size:0.75rem;color:var(--text-dim);font-weight:normal">— 从左侧拖入节点，连线定义依赖，保存后即可创建运行</span></h2>
            <div class="form-row">
                <input type="text" id="dg-name" placeholder="模板名称（必填，如 my-flow）" style="flex:1" />
                <input type="text" id="dg-desc" placeholder="描述（可选）" style="flex:2" />
                <button onclick="saveDesignerTemplate()">💾 保存模板</button>
                <button class="ghost" onclick="clearCanvas()">🗑 清空画布</button>
            </div>
        </div>

        <div class="designer-layout">
            <!-- 节点面板 -->
            <div class="node-palette" id="node-palette">
                <h3>节点</h3>
                <div class="palette-item" draggable="true" data-type="agent" ondragstart="paletteDrag(event)">
                    🤖 LLM 阶段
                </div>
                <div class="palette-item" draggable="true" data-type="start" ondragstart="paletteDrag(event)">
                    🚀 开始
                </div>
                <div class="palette-item" draggable="true" data-type="end" ondragstart="paletteDrag(event)">
                    🏁 结束
                </div>
                <div style="margin-top:16px;font-size:0.72rem;color:var(--text-dim);line-height:1.8;">
                    操作提示:<br/>
                    🖱 拖拽节点到画布<br/>
                    🔗 从节点右侧圆点拖出连线<br/>
                    📐 点击节点编辑配置<br/>
                    🗑 选中节点按 Delete 删除
                </div>
            </div>

            <!-- 画布 -->
            <div class="canvas-wrap">
                <div class="canvas-toolbar">
                    <span>画布（拖拽平移 · 滚轮缩放）</span>
                    <span style="margin-left:auto;display:flex;gap:6px;">
                        <button class="small" onclick="zoomCanvas(1.1)">➕</button>
                        <button class="small" onclick="zoomCanvas(0.9)">➖</button>
                        <button class="small" onclick="zoomCanvas(1)">1:1</button>
                    </span>
                </div>
                <div class="canvas-scroll" id="canvas-scroll">
                    <div class="canvas" id="canvas" onclick="canvasClick(event)">
                        <svg class="edges-svg" id="edges-svg"></svg>
                        <div id="nodes-layer"></div>
                    </div>
                </div>
            </div>

            <!-- 配置面板 -->
            <div class="node-config" id="node-config">
                <h3 id="config-title">节点配置</h3>
                <div id="config-body" style="font-size:0.8rem;color:var(--text-dim);">
                    点击画布中的节点进行配置
                </div>
            </div>
        </div>
    </div>

    <script>
        // ════════════════════════════════════
        // 状态
        // ════════════════════════════════════
        let currentFilter = '';
        let currentWfFilter = '';
        let tasks = [];
        let workflows = [];
        let wfStagesCache = {};   // run_id → stages[]
        let expandedTasks = new Set();
        let expandedWfs = new Set();

        // ════════════════════════════════════
        // Tabs
        // ════════════════════════════════════
        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            document.getElementById('panel-' + name).classList.add('active');
            if (name === 'workflows') {
                loadTemplates();
                loadWorkflows();
            }
        }

        // ════════════════════════════════════
        // SSE 实时流
        // ════════════════════════════════════
        const evtSource = new EventSource('/api/stream');
        evtSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (currentFilter) {
                tasks = data.tasks.filter(t => t.status === currentFilter);
            } else {
                tasks = data.tasks;
            }
            renderStats(data.stats);
            renderTasks();
            // workflow 面板也随 SSE 刷新（只刷新列表，展开详情用轮询）
            if (document.getElementById('panel-workflows').classList.contains('active')) {
                loadWorkflows(true);
            }
        };
        evtSource.onerror = function() {
            console.log('SSE connection lost, will retry...');
        };

        // ════════════════════════════════════
        // Agent 状态（轮询）
        // ════════════════════════════════════
        async function refreshAgents() {
            try {
                const res = await fetch('/api/runtimes');
                const data = await res.json();
                const bar = document.getElementById('agent-bar');
                const agents = data.local_agents || [];
                const runtimes = data.registered_runtimes || [];
                const onlineCount = runtimes.filter(r => r.is_online).length;
                let html = '';
                if (agents.length === 0) {
                    html = '<span class="agent-dot offline"></span> ⚠️ 未检测到 Pi/omp CLI';
                } else {
                    html = agents.map(a => {
                        const rt = runtimes.find(r => r.agent_type === a.name);
                        const isOnline = rt && rt.is_online;
                        return `<span class="agent-dot ${isOnline ? 'online' : 'offline'}"></span> ${a.name}`;
                    }).join(' ');
                }
                html += ` &nbsp;|&nbsp; 🖥️ Daemon: ${onlineCount > 0 ? '🟢在线' : '🔴离线'}`;
                bar.innerHTML = html;
            } catch(e) {}
        }
        refreshAgents();
        setInterval(refreshAgents, 15000);

        // ════════════════════════════════════
        // 工具函数
        // ════════════════════════════════════
        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }
        function timeAgo(t) {
            if (!t) return '';
            const d = new Date(t.replace(' ', 'T'));
            const s = (Date.now() - d.getTime()) / 1000;
            if (s < 60) return Math.floor(s) + 's 前';
            if (s < 3600) return Math.floor(s/60) + 'm 前';
            if (s < 86400) return Math.floor(s/3600) + 'h 前';
            return Math.floor(s/86400) + 'd 前';
        }
        function gateBadge(g) {
            if (!g) return '';
            return `<span class="badge badge-gate-${g}">gate:${g}</span>`;
        }

        // ════════════════════════════════════
        // 任务面板
        // ════════════════════════════════════
        function renderStats(stats) {
            document.querySelector('.stat.queued .num').textContent = stats.queued;
            document.querySelector('.stat.running .num').textContent = stats.running;
            document.querySelector('.stat.completed .num').textContent = stats.completed;
            document.querySelector('.stat.failed .num').textContent = stats.failed;
            document.querySelector('.stat.blocked .num').textContent = stats.blocked;
        }

        function renderTasks() {
            const container = document.getElementById('task-list');
            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty"><div class="icon">📭</div>暂无任务</div>';
                return;
            }
            container.innerHTML = tasks.map(t => `
                <div class="task-card${expandedTasks.has(t.id) ? ' expanded' : ''}" id="task-${t.id}" onclick="toggleTask('${t.id}')">
                    <div class="header">
                        <div>
                            <div class="title">${esc(t.title)}</div>
                            <div class="meta">
                                ${t.id} · ${t.agent_type || 'auto'} · ${timeAgo(t.created_at)}
                                ${t.workflow_run_id ? ` · 🔀 wf:${t.workflow_run_id} stage:${t.stage_key || ''}` : ''}
                                ${t.worktree_path ? ' · ' + t.worktree_path.split('/').pop() : ''}
                            </div>
                        </div>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <span class="badge badge-${t.status} ${t.status === 'running' ? 'pulse' : ''}">${t.status}</span>
                            ${gateBadge(t.gate_status)}
                            <div class="task-actions" onclick="event.stopPropagation()">
                                ${t.status === 'queued' || t.status === 'running' || t.status === 'claimed' ? `<button class="small" onclick="cancelTask('${t.id}')">🛑</button>` : ''}
                                ${t.status !== 'running' && t.status !== 'claimed' && t.status !== 'blocked' ? `<button class="small" onclick="blockTask('${t.id}')">🚫</button>` : ''}
                                ${t.status === 'blocked' ? `<button class="small" onclick="unblockTask('${t.id}')">🔓</button>` : ''}
                                ${t.status === 'failed' || t.status === 'completed' || t.status === 'cancelled' ? `<button class="small" onclick="retryTask('${t.id}')">🔄</button>` : ''}
                                ${t.status !== 'running' && t.status !== 'claimed' ? `<button class="small danger" onclick="deleteTask('${t.id}')">🗑</button>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="log-preview" id="log-${t.id}">${t.log ? esc(t.log) : '<em>等待执行...</em>'}</div>
                    <div class="comments-section" id="comments-${t.id}" style="display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:8px;"></div>
                </div>
            `).join('');
        }

        function toggleTask(taskId) {
            const card = document.getElementById('task-' + taskId);
            if (!card) return;
            card.classList.toggle('expanded');
            if (card.classList.contains('expanded')) {
                expandedTasks.add(taskId);
                loadComments(taskId);
            } else {
                expandedTasks.delete(taskId);
            }
        }

        function setFilter(status) {
            currentFilter = status;
            document.querySelectorAll('#panel-tasks .filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function createTask() {
            const title = document.getElementById('task-title').value.trim();
            const desc = document.getElementById('task-desc').value.trim();
            const repo = document.getElementById('task-repo').value.trim();
            const agentId = document.getElementById('task-agent').value;
            if (!title) { alert('请输入任务标题'); return; }
            const body = { title, description: desc, agent_type: agentId };
            if (repo) body.repo_path = repo;
            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                if (res.ok) {
                    document.getElementById('task-title').value = '';
                    document.getElementById('task-desc').value = '';
                }
            } catch(e) { alert('创建失败: ' + e.message); }
        }

        async function loadAgents() {
            try {
                const res = await fetch('/api/agents');
                const agents = await res.json();
                const list = document.getElementById('agent-list');
                list.innerHTML = agents.filter(a => a.is_active).map(a =>
                    `<div style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;min-width:180px;">
                        <b>${esc(a.name)}</b>
                        <div style="font-size:0.75rem;color:var(--text-dim);margin-top:2px;">${esc(a.system_prompt || '无 prompt').substring(0,60)}</div>
                        <div style="margin-top:4px;">
                            <button class="small" onclick="deleteAgent('${a.id}')">🗑</button>
                        </div>
                    </div>`
                ).join('') || '<span style="color:var(--text-dim)">暂无 Agent</span>';
                const sel = document.getElementById('task-agent');
                sel.innerHTML = '<option value="auto">自动 (无 Agent)</option>' +
                    agents.filter(a => a.is_active).map(a =>
                        `<option value="${a.id}">${esc(a.name)}</option>`
                    ).join('');
            } catch(e) {}
        }

        async function createAgent() {
            const name = document.getElementById('agent-name').value.trim();
            const prompt = document.getElementById('agent-prompt').value.trim();
            const model = document.getElementById('agent-model').value.trim();
            if (!name) { alert('请输入 Agent 名称'); return; }
            try {
                await fetch('/api/agents', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, system_prompt: prompt, model})
                });
                document.getElementById('agent-name').value = '';
                document.getElementById('agent-prompt').value = '';
                document.getElementById('agent-model').value = '';
                loadAgents();
            } catch(e) { alert('创建失败: ' + e.message); }
        }

        async function deleteAgent(id) {
            if (!confirm('确定删除此 Agent？')) return;
            try { await fetch(`/api/agents/${id}`, {method:'DELETE'}); loadAgents(); } catch(e) {}
        }

        async function loadComments(taskId) {
            const el = document.getElementById('comments-' + taskId);
            if (!el) return;
            el.style.display = 'block';
            try {
                const res = await fetch(`/api/tasks/${taskId}/comments`);
                const comments = await res.json();
                el.innerHTML = (comments || []).map(c =>
                    `<div style="font-size:0.8rem;padding:4px 0;border-bottom:1px solid var(--border);">
                        <b>${esc(c.author)}</b> <span style="color:var(--text-dim)">${timeAgo(c.created_at)}</span>
                        <div>${esc(c.content)}</div>
                    </div>`
                ).join('') + `
                    <div style="display:flex;gap:6px;margin-top:8px;">
                        <input id="comment-input-${taskId}" placeholder="添加评论..." style="flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--text);font-size:0.8rem;" />
                        <button class="small" onclick="addComment('${taskId}')">发送</button>
                    </div>`;
            } catch(e) {}
        }

        async function addComment(taskId) {
            const input = document.getElementById('comment-input-' + taskId);
            const content = input.value.trim();
            if (!content) return;
            try {
                await fetch(`/api/tasks/${taskId}/comments`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content, author: 'user'})
                });
                input.value = '';
                loadComments(taskId);
            } catch(e) {}
        }

        async function blockTask(taskId) {
            const reason = prompt('阻塞原因（可选）:');
            if (reason === null) return;
            try { await fetch(`/api/tasks/${taskId}/block`, {
                method:'PUT', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({reason: reason || ''})
            }); } catch(e) {}
        }

        async function unblockTask(taskId) {
            try { await fetch(`/api/tasks/${taskId}/unblock`, {method:'PUT'}); } catch(e) {}
        }

        function toggleAgentPanel() {
            const panel = document.getElementById('agent-list');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }

        async function cancelTask(taskId) {
            try { await fetch(`/api/tasks/${taskId}/cancel`, {method:'PUT'}); } catch(e) {}
        }
        async function retryTask(taskId) {
            try { await fetch(`/api/tasks/${taskId}/retry`, {method:'PUT'}); } catch(e) {}
        }
        async function deleteTask(taskId) {
            if (!confirm('确定删除此任务？')) return;
            try { await fetch(`/api/tasks/${taskId}`, {method:'DELETE'}); } catch(e) {}
        }

        // ════════════════════════════════════
        // Workflows 面板
        // ════════════════════════════════════
        async function loadTemplates() {
            try {
                const res = await fetch('/api/workflows/templates');
                const data = await res.json();
                const sel = document.getElementById('wf-template');
                const desc = document.getElementById('wf-template-desc');
                sel.innerHTML = (data.templates || []).map(t =>
                    `<option value="${esc(t.name)}">${esc(t.name)} — ${esc(t.description || '')}</option>`
                ).join('') || '<option value="">无可用模板</option>';
                if (data.templates && data.templates.length > 0) {
                    const t = data.templates[0];
                    desc.textContent = `📄 ${t.name}: ${t.stages ? t.stages.length + ' 个阶段: ' + t.stages.map(s => s.label).join(' → ') : ''}`;
                }
                sel.onchange = () => {
                    const t = (data.templates || []).find(x => x.name === sel.value);
                    if (t) desc.textContent = `📄 ${t.name}: ${t.stages ? t.stages.length + ' 个阶段: ' + t.stages.map(s => s.label).join(' → ') : ''}`;
                };
            } catch(e) {}
        }

        async function loadWorkflows(silent) {
            try {
                const res = await fetch('/api/workflows');
                const data = await res.json();
                workflows = data.workflows || [];
                if (currentWfFilter) {
                    workflows = workflows.filter(w => w.status === currentWfFilter);
                }
                renderWorkflows();
                // 刷新展开项的 stages
                expandedWfs.forEach(runId => loadWfStages(runId, true));
            } catch(e) { if (!silent) console.log(e); }
        }

        function setWfFilter(status) {
            currentWfFilter = status;
            document.querySelectorAll('#panel-workflows .filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadWorkflows();
        }

        function renderWorkflows() {
            const container = document.getElementById('wf-list');
            if (workflows.length === 0) {
                container.innerHTML = '<div class="empty"><div class="icon">🔀</div>暂无工作流，先创建一个吧</div>';
                return;
            }
            container.innerHTML = workflows.map(w => {
                const expanded = expandedWfs.has(w.id);
                return `
                <div class="wf-card${expanded ? ' expanded' : ''}" id="wf-${w.id}" onclick="toggleWf('${w.id}')">
                    <div class="header">
                        <div>
                            <div class="title">🔀 ${esc(w.title)}</div>
                            <div class="meta">
                                ${w.id} · ${esc(w.template_name)} · 创建于 ${timeAgo(w.created_at)}
                                ${w.branch ? ' · ' + esc(w.branch) : ''}
                            </div>
                        </div>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <span class="badge badge-wf-${w.status} ${w.status === 'running' ? 'pulse' : ''}">${w.status}</span>
                            ${w.current_stage ? `<span class="badge badge-queued">📍 ${esc(w.current_stage)}</span>` : ''}
                        </div>
                    </div>
                    <div class="wf-progress">
                        <div class="progress-track"><div class="progress-fill" style="width:${wfProgress(w)}%"></div></div>
                        <div class="wf-stages-label" id="wf-stages-label-${w.id}">加载阶段... (点击展开)</div>
                    </div>
                    <div class="wf-detail" id="wf-detail-${w.id}">
                        <div style="margin-top:10px;border-top:1px solid var(--border);padding-top:10px;" id="wf-stages-${w.id}">
                            <div class="loading" style="padding:10px;">⏳ 加载阶段...</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            // 为展开项加载阶段
            expandedWfs.forEach(runId => loadWfStages(runId, true));
        }

        function wfProgress(w) {
            const stages = wfStagesCache[w.id];
            if (!stages || stages.length === 0) return w.status === 'completed' ? 100 : 5;
            const done = stages.filter(s => s.status === 'completed').length;
            return Math.round(done / stages.length * 100);
        }

        function toggleWf(runId) {
            const card = document.getElementById('wf-' + runId);
            if (!card) return;
            card.classList.toggle('expanded');
            if (card.classList.contains('expanded')) {
                expandedWfs.add(runId);
                loadWfStages(runId);
            } else {
                expandedWfs.delete(runId);
            }
        }

        async function loadWfStages(runId, silent) {
            try {
                const res = await fetch(`/api/workflows/${runId}/stages`);
                const data = await res.json();
                wfStagesCache[runId] = data.stages || [];
                renderWfStages(runId);
            } catch(e) { if (!silent) console.log(e); }
        }

        function renderWfStages(runId) {
            const el = document.getElementById('wf-stages-' + runId);
            const label = document.getElementById('wf-stages-label-' + runId);
            if (!el) return;
            const stages = wfStagesCache[runId] || [];
            if (label) {
                const done = stages.filter(s => s.status === 'completed').length;
                label.textContent = `${done}/${stages.length} 阶段完成` + (stages.length ? ` · ${stages.map(s => s.stage_key).join(' → ')}` : '');
            }
            if (stages.length === 0) {
                el.innerHTML = '<div class="empty" style="padding:15px;">暂无阶段任务</div>';
                return;
            }
            const workflow = workflows.find(w => w.id === runId);
            const currentIdx = workflow ? workflow.current_stage_index : -1;

            el.innerHTML = stages.map((s, i) => {
                const cls = i < (workflow && workflow.current_stage_index !== null ? workflow.current_stage_index : 0) ? 'done'
                    : (s.status === 'running' ? 'current' : '');
                const resultPreview = s.result ? `<div class="stage-result">${esc(s.result).substring(0, 500)}</div>` : '';
                // 审批按钮：仅当该阶段是当前阶段且 gate 已判定
                const isCurrent = workflow && s.stage_index === workflow.current_stage_index;
                const showActions = isCurrent && workflow.status === 'running';
                return `
                <div class="stage-row ${cls}">
                    <span class="stage-name">${i+1}. ${esc(s.stage_key)}</span>
                    <span class="badge badge-${s.status} ${s.status === 'running' ? 'pulse' : ''}">${s.status}</span>
                    ${gateBadge(s.gate_status)}
                    <span class="stage-meta">${s.id ? s.id.substring(0,8) : ''}${s.session_id ? ' · session ✓' : ''}</span>
                    ${showActions ? `
                    <div class="stage-actions" onclick="event.stopPropagation()">
                        <input type="text" id="reason-${s.id}" placeholder="理由 (reject/force/waive 必填)" />
                        <button class="small" onclick="wfAction('${runId}', 'approve', '${s.id}')">✅ 批准</button>
                        <button class="small warn" onclick="wfAction('${runId}', 'reject', '${s.id}')">⛔ 驳回</button>
                        <button class="small" onclick="wfAction('${runId}', 'force', '${s.id}')">⚡ 强制</button>
                        <button class="small ghost" onclick="wfAction('${runId}', 'waive', '${s.id}')">⏭️ 豁免</button>
                    </div>` : ''}
                    ${resultPreview}
                </div>`;
            }).join('');
        }

        async function wfAction(runId, action, taskId) {
            const reasonInput = document.getElementById('reason-' + taskId);
            const reason = reasonInput ? reasonInput.value.trim() : '';
            if ((action === 'reject' || action === 'force' || action === 'waive') && !reason) {
                alert(action + ' 操作需要填写理由');
                return;
            }
            let url = `/api/workflows/${runId}/${action}`;
            if (reason) url += `?reason=${encodeURIComponent(reason)}`;
            try {
                const res = await fetch(url, {method: 'POST'});
                if (res.ok) {
                    loadWorkflows(true);
                    loadWfStages(runId);
                } else {
                    const err = await res.json();
                    alert('操作失败: ' + (err.detail || res.status));
                }
            } catch(e) { alert('请求失败: ' + e.message); }
        }

        async function createWorkflow() {
            const template = document.getElementById('wf-template').value;
            const title = document.getElementById('wf-title').value.trim();
            const repo = document.getElementById('wf-repo').value.trim();
            if (!template) { alert('请选择模板'); return; }
            if (!title) { alert('请输入工作流标题'); return; }
            const body = { template_name: template, title };
            if (repo) body.repo_path = repo;
            try {
                const res = await fetch('/api/workflows', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                if (res.ok) {
                    document.getElementById('wf-title').value = '';
                    const data = await res.json();
                    switchTab('workflows');
                    loadWorkflows();
                    // 自动展开新建的 workflow
                    if (data.run && data.run.id) {
                        expandedWfs.add(data.run.id);
                        setTimeout(() => { toggleWf(data.run.id); }, 300);
                    }
                } else {
                    const err = await res.json();
                    alert('创建失败: ' + (err.detail || res.status));
                }
            } catch(e) { alert('请求失败: ' + e.message); }
        }

        // ════════════════════════════════════
        // 编排器（拖拽画布）
        // ════════════════════════════════════
        let designerNodes = [];   // {id, type, label, system_prompt, required_artifacts, x, y}
        let designerEdges = [];   // {from, to}
        let selectedNodeId = null;
        let canvasZoom = 1;
        let nodeIdSeq = 1;
        let tempEdge = null;      // {from, x, y} 正在拖出的连线

        function switchTab(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('tab-' + name).classList.add('active');
            document.getElementById('panel-' + name).classList.add('active');
            if (name === 'workflows') {
                loadTemplates();
                loadWorkflows();
            }
            if (name === 'designer') {
                loadDesignerTemplateList();
            }
        }

        function paletteDrag(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.type);
        }

        function canvasClick(e) {
            if (e.target === document.getElementById('canvas') ||
                e.target === document.getElementById('nodes-layer') ||
                e.target === document.getElementById('edges-svg')) {
                selectedNodeId = null;
                renderDesigner();
                showNodeConfig(null);
            }
        }

        // 画布接受节点拖放
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('canvas');
            canvas.addEventListener('dragover', e => e.preventDefault());
            canvas.addEventListener('drop', e => {
                e.preventDefault();
                const type = e.dataTransfer.getData('text/plain') || 'agent';
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / canvasZoom;
                const y = (e.clientY - rect.top) / canvasZoom;
                addDesignerNode(type, x - 75, y - 30);
            });
        });

        function addDesignerNode(type, x, y) {
            const id = 'n' + (nodeIdSeq++);
            const node = {
                id,
                type,
                x: Math.max(10, x), y: Math.max(10, y),
                label: type === 'start' ? '开始' : type === 'end' ? '结束' : '阶段 ' + nodeIdSeq,
                system_prompt: '你是执行该阶段的专家。完成本阶段任务并产出成果文件。',
                required_artifacts: ['*.md'],
            };
            designerNodes.push(node);
            renderDesigner();
            selectedNodeId = id;
            showNodeConfig(node);
        }

        function renderDesigner() {
            const layer = document.getElementById('nodes-layer');
            layer.innerHTML = designerNodes.map(n => {
                const cls = n.type === 'start' ? 'start-node' : n.type === 'end' ? 'end-node' : '';
                const icon = n.type === 'start' ? '🚀' : n.type === 'end' ? '🏁' : '🤖';
                return `
                <div class="flow-node ${cls} ${n.id === selectedNodeId ? 'selected' : ''}"
                     id="node-${n.id}"
                     style="left:${n.x}px;top:${n.y}px;"
                     onmousedown="nodeDragStart(event, '${n.id}')"
                     onclick="event.stopPropagation(); selectNode('${n.id}')">
                    <div class="node-title">${icon} ${esc(n.label)}</div>
                    <div class="node-sub">${esc(n.id)} · ${esc(n.type)}</div>
                    ${n.type === 'agent' || n.type === 'start' ? `
                    <div class="node-port" title="拖出连线"
                         onmousedown="edgeStart(event, '${n.id}')"
                         onmouseup="edgeEnd(event, '${n.id}')"></div>` : ''}
                    <div class="node-port in-port" style="display:none;"></div>
                </div>`;
            }).join('');
            renderEdges();
        }

        function renderEdges() {
            const svg = document.getElementById('edges-svg');
            const paths = designerEdges.map(e => {
                const from = designerNodes.find(n => n.id === e.from);
                const to = designerNodes.find(n => n.id === e.to);
                if (!from || !to) return '';
                const x1 = from.x + 150, y1 = from.y + 25;
                const x2 = to.x, y2 = to.y + 25;
                const mx = (x1 + x2) / 2;
                return `<path class="edge-path" d="M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" />`;
            });
            if (tempEdge) {
                const from = designerNodes.find(n => n.id === tempEdge.from);
                if (from) {
                    const x1 = from.x + 150, y1 = from.y + 25;
                    paths.push(`<path class="edge-path edge-temp" d="M ${x1} ${y1} C ${(x1+tempEdge.x)/2} ${y1}, ${(x1+tempEdge.x)/2} ${tempEdge.y}, ${tempEdge.x} ${tempEdge.y}" />`);
                }
            }
            svg.innerHTML = paths.join('');
        }

        function nodeDragStart(e, id) {
            e.preventDefault();
            const node = designerNodes.find(n => n.id === id);
            if (!node) return;
            selectedNodeId = id;
            renderDesigner();
            showNodeConfig(node);
            const startX = e.clientX, startY = e.clientY;
            const origX = node.x, origY = node.y;
            function onMove(ev) {
                node.x = origX + (ev.clientX - startX) / canvasZoom;
                node.y = origY + (ev.clientY - startY) / canvasZoom;
                const el = document.getElementById('node-' + id);
                if (el) { el.style.left = node.x + 'px'; el.style.top = node.y + 'px'; }
                renderEdges();
            }
            function onUp() {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        }

        function selectNode(id) {
            selectedNodeId = id;
            renderDesigner();
            const node = designerNodes.find(n => n.id === id);
            showNodeConfig(node);
        }

        // ── 连线 ──
        function edgeStart(e, id) {
            e.stopPropagation();
            e.preventDefault();
            const canvas = document.getElementById('canvas');
            const rect = canvas.getBoundingClientRect();
            tempEdge = {from: id, x: e.clientX - rect.left, y: e.clientY - rect.top};
            renderEdges();
            function onMove(ev) {
                if (!tempEdge) return;
                tempEdge.x = ev.clientX - rect.left;
                tempEdge.y = ev.clientY - rect.top;
                renderEdges();
            }
            function onUp(ev) {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                if (!tempEdge) return;
                // 检查是否落在某节点上
                const target = designerNodes.find(n => {
                    const el = document.getElementById('node-' + n.id);
                    if (!el) return false;
                    const r = el.getBoundingClientRect();
                    return ev.clientX >= r.left && ev.clientX <= r.right &&
                           ev.clientY >= r.top && ev.clientY <= r.bottom;
                });
                if (target && target.id !== tempEdge.from) {
                    // 去重
                    if (!designerEdges.some(x => x.from === tempEdge.from && x.to === target.id)) {
                        designerEdges.push({from: tempEdge.from, to: target.id});
                    }
                }
                tempEdge = null;
                renderEdges();
            }
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        }

        function edgeEnd(e, id) {
            // mouseup 已在 edgeStart 的 onUp 处理，此函数仅防止冒泡
        }

        // ── 缩放 ──
        function zoomCanvas(factor) {
            canvasZoom = Math.min(2, Math.max(0.5, canvasZoom * factor));
            document.getElementById('canvas').style.transform = `scale(${canvasZoom})`;
        }

        // ── 配置面板 ──
        function showNodeConfig(node) {
            const title = document.getElementById('config-title');
            const body = document.getElementById('config-body');
            if (!node) {
                title.textContent = '节点配置';
                body.innerHTML = '<div style="color:var(--text-dim);">点击画布中的节点进行配置</div>';
                return;
            }
            title.textContent = '节点: ' + node.label;
            body.innerHTML = `
                <div class="config-field">
                    <label>节点 ID（key）</label>
                    <input value="${esc(node.id)}" disabled />
                </div>
                <div class="config-field">
                    <label>名称</label>
                    <input id="cfg-label" value="${esc(node.label)}" onchange="updateNodeConfig('label', this.value)" />
                </div>
                <div class="config-field">
                    <label>类型</label>
                    <select id="cfg-type" onchange="updateNodeConfig('type', this.value)">
                        <option value="agent" ${node.type === 'agent' ? 'selected' : ''}>🤖 LLM 阶段</option>
                        <option value="start" ${node.type === 'start' ? 'selected' : ''}>🚀 开始</option>
                        <option value="end" ${node.type === 'end' ? 'selected' : ''}>🏁 结束</option>
                    </select>
                </div>
                ${node.type === 'agent' || node.type === 'start' ? `
                <div class="config-field">
                    <label>System Prompt（任务指令）</label>
                    <textarea id="cfg-prompt" onchange="updateNodeConfig('system_prompt', this.value)">${esc(node.system_prompt)}</textarea>
                </div>
                <div class="config-field">
                    <label>产出文件 glob（逗号分隔）</label>
                    <input id="cfg-artifacts" value="${esc((node.required_artifacts || []).join(','))}" onchange="updateNodeConfig('required_artifacts', this.value.split(',').map(s=>s.trim()).filter(Boolean))" />
                </div>` : ''}
                <div class="config-field" style="margin-top:14px;">
                    <label>依赖（来自其他节点）</label>
                    <div style="font-size:0.75rem;color:var(--text-dim);">
                        ${designerEdges.filter(e => e.to === node.id).map(e => '← ' + e.from).join('<br/>') || '（无，从左侧圆点拖出连线到本节点）'}
                    </div>
                </div>
                <button class="delete-node-btn" onclick="deleteSelectedNode()">🗑 删除节点</button>
            `;
        }

        function updateNodeConfig(field, value) {
            const node = designerNodes.find(n => n.id === selectedNodeId);
            if (!node) return;
            node[field] = value;
            renderDesigner();
            showNodeConfig(node);
        }

        function deleteSelectedNode() {
            if (!selectedNodeId) return;
            designerNodes = designerNodes.filter(n => n.id !== selectedNodeId);
            designerEdges = designerEdges.filter(e => e.from !== selectedNodeId && e.to !== selectedNodeId);
            selectedNodeId = null;
            renderDesigner();
            showNodeConfig(null);
        }

        function clearCanvas() {
            if (!confirm('确定清空画布？')) return;
            designerNodes = [];
            designerEdges = [];
            selectedNodeId = null;
            renderDesigner();
            showNodeConfig(null);
        }

        // 键盘删除
        document.addEventListener('keydown', e => {
            if (document.getElementById('panel-designer').classList.contains('active') &&
                (e.key === 'Delete' || e.key === 'Backspace') &&
                !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
                deleteSelectedNode();
            }
        });

        // ── 保存 / 加载模板 ──
        async function saveDesignerTemplate() {
            const name = document.getElementById('dg-name').value.trim();
            if (!name) { alert('请输入模板名称'); return; }
            if (designerNodes.length === 0) { alert('画布为空，先添加节点'); return; }
            // 校验：结束节点必须有入边
            const endNodes = designerNodes.filter(n => n.type === 'end');
            for (const en of endNodes) {
                if (!designerEdges.some(e => e.to === en.id)) {
                    alert(`结束节点 ${en.label} 没有输入连线`);
                    return;
                }
            }
            const desc = document.getElementById('dg-desc').value.trim();
            const nodes = designerNodes.map(n => ({
                key: n.id, label: n.label, type: n.type,
                system_prompt: n.system_prompt, required_artifacts: n.required_artifacts,
                x: Math.round(n.x), y: Math.round(n.y),
            }));
            const edges = designerEdges.map(e => ({from: e.from, to: e.to}));
            try {
                const res = await fetch('/api/workflow-templates', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, description: desc, nodes, edges})
                });
                if (res.ok) {
                    const data = await res.json();
                    alert(`✅ 模板 ${name} 已保存（${data.stages} 个阶段）\n现在可以到「工作流」标签创建运行`);
                    loadDesignerTemplateList();
                } else {
                    const err = await res.json();
                    alert('保存失败: ' + (err.detail || res.status));
                }
            } catch(e) { alert('请求失败: ' + e.message); }
        }

        async function loadDesignerTemplateList() {
            try {
                const res = await fetch('/api/workflows/templates');
                const data = await res.json();
                const names = (data.templates || []).map(t => t.name);
                const palette = document.getElementById('node-palette');
                // 在提示下方加模板列表
                let existing = document.getElementById('dg-template-list');
                if (!existing) {
                    existing = document.createElement('div');
                    existing.id = 'dg-template-list';
                    existing.style.cssText = 'margin-top:14px;border-top:1px solid var(--border);padding-top:10px;';
                    palette.appendChild(existing);
                }
                existing.innerHTML = '<h3 style="font-size:0.78rem;color:var(--text-dim);margin-bottom:6px;">已保存模板</h3>' +
                    names.map(n => `<div style="font-size:0.75rem;padding:4px 6px;cursor:pointer;border-radius:4px;" onmouseover="this.style.background='var(--bg-input)'" onmouseout="this.style.background='transparent'" onclick="loadDesignerTemplate('${esc(n)}')">📄 ${esc(n)}</div>`).join('') ||
                    '<div style="font-size:0.72rem;color:var(--text-dim);">暂无</div>';
            } catch(e) {}
        }

        async function loadDesignerTemplate(name) {
            try {
                const res = await fetch(`/api/workflow-templates/${name}`);
                if (!res.ok) return;
                const t = await res.json();
                document.getElementById('dg-name').value = t.name;
                document.getElementById('dg-desc').value = t.description || '';
                // 转换 stages → nodes/edges
                designerNodes = (t.stages || []).map(s => ({
                    id: s.key, type: (s.canvas && s.canvas.type) || 'agent',
                    label: s.label, x: (s.canvas && s.canvas.x) || 100,
                    y: (s.canvas && s.canvas.y) || 100,
                    system_prompt: s.agent.system_prompt,
                    required_artifacts: s.required_artifacts,
                }));
                designerEdges = [];
                (t.stages || []).forEach(s => {
                    (s.depends_on || []).forEach(d => designerEdges.push({from: d, to: s.key}));
                });
                nodeIdSeq = Math.max(...designerNodes.map(n => parseInt(n.id.replace(/\D/g, '')) || 0), 0) + 1;
                selectedNodeId = null;
                renderDesigner();
                showNodeConfig(null);
            } catch(e) { alert('加载失败: ' + e.message); }
        }

        // ════════════════════════════════════
        // 初始化
        // ════════════════════════════════════
        loadAgents();
    </script>
</body>
</html>
